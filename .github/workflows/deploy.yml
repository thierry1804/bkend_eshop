name: Déploiement Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Déployer l'application
    runs-on: ubuntu-latest
    environment: prod
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Allow Git to use workspace with different ownership
        run: |
          git config --global --add safe.directory /github/workspace

      - name: Fix permissions
        run: |
          sudo chown -R $USER:$USER $GITHUB_WORKSPACE
          sudo chmod -R u+w $GITHUB_WORKSPACE

      - name: Créer le fichier .env pour le build
        run: |
          echo "APP_ENV=prod" > .env
          echo "APP_DEBUG=0" >> .env
          echo "DATABASE_URL=sqlite:///:memory:" >> .env
          echo "MESSENGER_TRANSPORT_DSN=doctrine://default" >> .env
          echo "MAILER_DSN=null://null" >> .env

      - name: Configurer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: ctype, iconv, pdo, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Ajouter symfony/debug-bundle
        env:
          COMPOSER_HOME: ${{ runner.temp }}/composer
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/composer-cache
        run: composer require --dev symfony/debug-bundle --no-interaction --prefer-dist --no-progress

      - name: Installer les dépendances
        env:
          COMPOSER_HOME: ${{ runner.temp }}/composer
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/composer-cache
          APP_ENV: prod
          APP_DEBUG: 0
          DATABASE_URL: "sqlite:///:memory:"
          MESSENGER_TRANSPORT_DSN: "doctrine://default"
          MAILER_DSN: "null://null"
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Vérifier la syntaxe PHP
        run: find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;

      - name: Préparer l'environnement de production
        env:
          APP_ENV: prod
          APP_DEBUG: 0
          APP_SECRET: build-secret-key-for-production
          DATABASE_URL: "sqlite:///:memory:"
          MESSENGER_TRANSPORT_DSN: "doctrine://default"
          MAILER_DSN: "null://null"
        run: |
          php bin/console cache:clear --env=prod --no-debug || true
          php bin/console cache:warmup --env=prod --no-debug || true

      - name: Préparer les fichiers pour le déploiement
        run: |
          # Créer un répertoire de déploiement propre
          mkdir -p deploy
          
          # Copier le code (sans vendor : trop de fichiers → timeouts / erreurs 4xx sur le FTP)
          cp -r bin config public src templates composer.json composer.lock symfony.lock deploy/ 2>/dev/null || true
          
          # Une seule archive : upload fiable ; extraction sur le serveur via scripts/post-deploy.sh
          echo "Création de vendor.tar.gz…"
          tar -czf deploy/vendor.tar.gz vendor
          ls -lh deploy/vendor.tar.gz
          
          # Copier le fichier .htaccess à la racine (si présent)
          if [ -f ".htaccess" ]; then
            cp .htaccess deploy/ 2>/dev/null || true
          fi
          
          # Copier le dossier scripts (contient post-deploy.sh)
          if [ -d "scripts" ]; then
            cp -r scripts deploy/ 2>/dev/null || true
          fi
          
          # Créer les répertoires nécessaires
          mkdir -p deploy/var/cache deploy/var/log
          
          # Créer un fichier .env.local avec les valeurs de base
          # Les secrets doivent être ajoutés manuellement sur le serveur
          cat > deploy/.env.local << 'EOF'
          APP_ENV=prod
          APP_DEBUG=0
          # Les variables suivantes doivent être configurées manuellement :
          # APP_SECRET=
          # MAILER_DSN=
          # MESSENGER_TRANSPORT_DSN=doctrine://default
          # DATABASE_URL=
          # CORS_ALLOW_ORIGIN=
          EOF

      - name: Vérifier la configuration FTP
        id: check_ftp
        run: |
          if [ -z "${{ secrets.FTP_SERVER }}" ] || [ -z "${{ secrets.FTP_USERNAME }}" ] || [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "ftp_configured=false" >> $GITHUB_OUTPUT
            echo "⚠️  Les secrets FTP ne sont pas configurés, le déploiement sera ignoré"
          else
            echo "ftp_configured=true" >> $GITHUB_OUTPUT
            echo "✓ Configuration FTP détectée"
          fi

      - name: Préparer les chemins FTP
        id: ftp_paths
        if: steps.check_ftp.outputs.ftp_configured == 'true'
        run: |
          DIR="${{ secrets.FTP_SERVER_DIR }}"
          if [ -z "$DIR" ] || [ "$DIR" = "/" ]; then
            echo "server_dir=/" >> "$GITHUB_OUTPUT"
          else
            case "$DIR" in
              */) echo "server_dir=$DIR" >> "$GITHUB_OUTPUT" ;;
              *) echo "server_dir=${DIR}/" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
          PROTO="${{ secrets.FTP_PROTOCOL || 'ftp' }}"
          PORT="${{ secrets.FTP_PORT }}"
          if [ -z "$PORT" ]; then
            if [ "$PROTO" = "ftps-legacy" ]; then PORT=990; else PORT=21; fi
          fi
          echo "ftp_port=$PORT" >> "$GITHUB_OUTPUT"

      - name: Vérifier la connectivité FTP
        if: steps.check_ftp.outputs.ftp_configured == 'true'
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          PROTO="${{ secrets.FTP_PROTOCOL || 'ftp' }}"
          PORT="${{ steps.ftp_paths.outputs.ftp_port }}"
          SERVER="${{ secrets.FTP_SERVER }}"
          USER="${{ secrets.FTP_USERNAME }}"
          PASS="${{ secrets.FTP_PASSWORD }}"
          if [ "$PROTO" = "sftp" ]; then
            echo "::error::FTP-Deploy-Action ne prend en charge que ftp, ftps et ftps-legacy (pas SFTP). Définissez FTP_PROTOCOL sur ftp ou ftps, ou remplacez l'étape par SCP/rsync (ex. appleboy/scp-action)."
            exit 1
          fi
          # Configurer lftp AVANT la connexion pour que ssl:verify-certificate
          # soit appliqué dès le handshake SSL (important pour ftps-legacy/ftps://)
          echo "set ssl:verify-certificate no" > ~/.lftprc
          echo "set net:timeout 20" >> ~/.lftprc
          echo "set net:max-retries 2" >> ~/.lftprc
          echo "Test ${PROTO} sur ${SERVER}:${PORT}…"
          case "$PROTO" in
            ftps)
              lftp -u "$USER","$PASS" -e "set ftp:ssl-force true; ls; bye" -p "$PORT" "ftp://$SERVER"
              ;;
            ftps-legacy)
              lftp -u "$USER","$PASS" -e "ls; bye" -p "$PORT" "ftps://$SERVER"
              ;;
            *)
              lftp -u "$USER","$PASS" -e "ls; bye" -p "$PORT" "ftp://$SERVER"
              ;;
          esac

      - name: Déployer via FTP
        if: steps.check_ftp.outputs.ftp_configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ steps.ftp_paths.outputs.ftp_port }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./deploy/
          server-dir: ${{ steps.ftp_paths.outputs.server_dir }}
          dangerous-clean-slate: false
          # ms — archive unique ; augmenter si connexion très lente
          timeout: 3600000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/.env.dev
            **/.env.test
            **/.env.prod
            **/var/cache/**
            **/var/log/**
            **/tests/**
            **/*.md
            **/.gitignore

      - name: Rappel — extraire vendor sur le serveur
        if: success() && steps.check_ftp.outputs.ftp_configured == 'true'
        run: |
          echo "::notice::Après FTP : sur le serveur (SSH), à la racine Symfony, lancer : bash scripts/post-deploy.sh"
          echo "::notice::(extrait vendor.tar.gz, schéma DB, cache, etc.) ou au minimum : tar -xzf vendor.tar.gz && rm -f vendor.tar.gz"

      - name: Appeler le script de post-déploiement automatique
        run: |
          TOKEN="${{ secrets.POST_DEPLOY_TOKEN }}"
          URL="${{ secrets.POST_DEPLOY_WEBHOOK_URL }}"
          
          if [ -z "$URL" ]; then
            echo "⚠️  POST_DEPLOY_WEBHOOK_URL n'est pas configuré, étape ignorée"
            exit 0
          fi
          
          if [ -n "$TOKEN" ]; then
            curl -X GET "$URL?token=$TOKEN" || echo "⚠️  Impossible d'appeler le webhook (non bloquant)"
          else
            curl -X GET "$URL" || echo "⚠️  Impossible d'appeler le webhook (non bloquant)"
          fi
        continue-on-error: true

